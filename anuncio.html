<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tutorial</title>
  <style>

    @import url("https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap");

    body {
      margin: 0;
      padding: 0 15px;
      font-family: "Poppins", sans-serif;
      text-align: center;
      background-color: #f5f5f5;
    }

    .header-txt {
  flex-basis: 50%;
  text-align: center;
}

.header-txt h1 {
  font-size: 90px;
  text-transform: uppercase;
  line-height: 1;
  color: #a0153e;
  font-family: "Oswald", sans-serif;
  margin-bottom: 15px;
}

    .video-container {
      margin: 20px auto;
      max-width: 800px;
      width: 100%;
    }

    .video-container video {
      width: 100%;
      height: auto;
      border-radius: 10px;
    }

    .big-button {
      margin: 30px auto 60px;
      padding: 15px 30px;
      font-size: 20px;
      background: linear-gradient(45deg, #ff416c, #ff4b2b);
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      display: inline-block;
    }

    .big-button:hover {
      transform: scale(1.05);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
    }

    /* Estilos para pantallas pequeñas */
    @media (max-width: 600px) {
      h1 {
        font-size: 28px;
        margin-top: 30px;
      }

      .big-button {
        font-size: 18px;
        padding: 12px 25px;
      }
    }
  </style>
</head>
<body>
<heade class="header">
  <div class="header-txt">
    <h1>Tutorial su come acquistare</h1>
  </div>
  
</header>
  

  <div class="video-container">
    <!-- Puedes reemplazar este video de ejemplo con el tuyo -->
    <video controls>
      <source src="img-new/anuncio.mp4" type="video/mp4">
      Il tuo browser non supporta il video.
    </video>
  </div>

  <button class="big-button">Clicca qui</button>

</body>
</html>
